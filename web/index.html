<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>wurble</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; }
  label { display: flex; justify-content: space-between; align-items: center; }
  label input { width: 5rem; }
  select, [name=text], button { grid-column: 1 / -1; }
  p { font-size: 1.5rem; min-height: 2em; }
  audio { width: 100%; }
</style>
<form novalidate>
  <select name="preset">
    <option>chitter</option>
    <option>grumble</option>
    <option>blip</option>
    <option>babble</option>
  </select>
  <label>pitch <input name="pitch" type="number" step="0.05"></label>
  <label>jitter <input name="jitter" type="number" step="0.5"></label>
  <label>inflection <input name="inflection" type="number" step="0.5"></label>
  <label>tick <input name="tick" type="number" step="0.005"></label>
  <label>length <input name="length" type="number" step="0.005"></label>
  <label>skip <input name="skip" type="number"></label>
  <label>pause <input name="pause" type="number" step="0.01"></label>
  <input name="text" value="Oh, hi! Um... can you hear me?">
  <button>Say it</button>
</form>
<p></p>
<audio controls></audio>
<script type="module">
  import init, { Voice } from "./wurble.js";

  await init();
  const form = document.forms[0];
  const said = document.querySelector("p");
  const audio = document.querySelector("audio");
  const fields = form.querySelectorAll("label input");
  let voice, text, cues;

  form.preset.onchange = () => {
    voice = Voice[form.preset.value]();
    // f32 fields widen to noisy JS numbers, so round them for display.
    for (const input of fields) input.value = +voice[input.name].toPrecision(6);
  };
  form.preset.onchange();

  form.onsubmit = event => {
    event.preventDefault();
    for (const input of fields) voice[input.name] = Number(input.value);
    text = form.text.value;
    cues = voice.cues(text);
    URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(new Blob([voice.wav(text)], { type: "audio/wav" }));
    audio.play();
  };

  audio.onplay = audio.onended = function reveal() {
    said.textContent = [...text].slice(0, cues.filter(cue => cue <= audio.currentTime).length).join("");
    if (!audio.paused) requestAnimationFrame(reveal);
  };
</script>
